[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credit-risk"
version = "0.0.1"
description = "Consumer credit risk modeling on public Lending Club data, with a layered DuckDB/dbt warehouse and out-of-time evaluation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["credit_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
