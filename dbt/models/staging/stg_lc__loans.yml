version: 2

models:
  - name: stg_lc__loans
    description: One row per Lending Club accepted loan, typed. Footer rows removed.
    columns:
      - name: loan_id
        tests: [unique, not_null]
      - name: issue_date
        tests: [not_null]
      - name: term_months
        tests:
          - not_null
          - accepted_values: {arguments: {values: [36, 60], quote: false}}
      - name: grade
        tests:
          - not_null
          - accepted_values: {arguments: {values: ['A', 'B', 'C', 'D', 'E', 'F', 'G']}}
      - name: loan_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Fully Paid
                  - Charged Off
                  - Default
                  - Current
                  - In Grace Period
                  - Late (16-30 days)
                  - Late (31-120 days)
                  - "Does not meet the credit policy. Status:Fully Paid"
                  - "Does not meet the credit policy. Status:Charged Off"
      - name: loan_amnt
        tests: [not_null, {in_range: {arguments: {min_value: 0}}}]
      - name: int_rate
        tests: [not_null, {in_range: {arguments: {min_value: 0, max_value: 100}}}]
      - name: fico_range_low
        tests: [{in_range: {arguments: {min_value: 300, max_value: 850}}}]
      - name: annual_inc
        tests: [{in_range: {arguments: {min_value: 0}}}]
      - name: revol_util
        tests: [{in_range: {arguments: {min_value: 0}}}]
